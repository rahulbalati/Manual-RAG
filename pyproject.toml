[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "service-manual-rag"
version = "0.1.0"
description = "Multimodal RAG over technical service manual PDFs"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.40.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.3",
    "orjson>=3.10.15",
    "chromadb>=0.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "pypdfium2>=4.0.0",
    "pillow>=10.0.0",
    "rank-bm25>=0.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
